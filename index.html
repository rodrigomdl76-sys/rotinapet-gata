<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11183d">
<title>RotinaPet — Minha Gatinha</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;background:#0b102c}
button{font:inherit;color:inherit}.app{min-height:100dvh;max-width:520px;margin:auto;padding:14px 14px 92px;position:relative;overflow:hidden;background:
radial-gradient(circle at 70% 20%,#58307a88,transparent 32%),
radial-gradient(circle at 15% 45%,#174c9c88,transparent 34%),
linear-gradient(180deg,#10183f 0%,#19194b 42%,#502c50 100%)}
.app:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.25;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:33px 33px}
.layer{position:relative;z-index:1}.header{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.profile{display:flex;gap:10px;align-items:center}.avatar{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:#b8dc6d;border:3px solid #8a74ff;box-shadow:0 6px 20px #0005}.title b{font-size:21px}.title small{display:block;color:#bdc5ec;margin-top:2px}.stats{display:flex;gap:6px}.pill{background:#11183ddd;border:1px solid #55539b;border-radius:16px;padding:9px 11px;font-weight:800;box-shadow:0 6px 18px #0003}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.quick button{border:1px solid #7752a9;background:#11183dcc;border-radius:18px;padding:9px 5px;min-height:65px;font-weight:800}.quick span{display:block;font-size:23px;margin-bottom:3px}
.scene{margin-top:12px;min-height:410px;border-radius:28px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;overflow:hidden;background:
radial-gradient(circle at 50% 90%,#c381d2 0 18%,transparent 19%),
linear-gradient(180deg,#172d6eaa,#502d5c99 70%,#7e4a4b99);box-shadow:inset 0 0 60px #0005,0 14px 35px #0004}
.moon{position:absolute;top:35px;left:18%;font-size:54px;filter:drop-shadow(0 0 18px #fff8)}.bubble{position:absolute;top:70px;left:14px;width:126px;padding:15px;border-radius:26px 26px 26px 6px;background:#f5efff;color:#563f91;font-weight:800;line-height:1.35;box-shadow:0 10px 30px #0003}.pet-wrap{width:min(330px,80vw);height:300px;display:flex;align-items:flex-end;justify-content:center;position:relative;z-index:3}.pet-img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 18px 14px #0006);user-select:none;-webkit-user-drag:none}.pet-error{display:none;padding:16px;background:#711d35;border-radius:16px;text-align:center}
.progress{width:80%;height:30px;margin:0 auto 16px;border-radius:99px;background:#121741dd;display:flex;align-items:center;padding:5px 9px;gap:8px;font-size:12px;font-weight:900}.track{height:10px;flex:1;background:#302c69;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ffd333,#ff9e1b);border-radius:99px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.action{border:1px solid #4453a1;background:#10183ee8;border-radius:20px;min-height:92px;padding:10px 4px;font-weight:800;box-shadow:0 10px 24px #0004}.action .ico{display:block;font-size:30px;margin-bottom:7px}.action small{display:block;color:#aeb9df;font-size:9px;margin-top:4px}
.tasks{margin-top:12px;background:#11183dcc;border:1px solid #4e4c8a;border-radius:20px;padding:12px}.tasks h3{margin:0 0 8px;font-size:14px}.task{display:flex;align-items:center;gap:8px;background:#ffffff0d;padding:9px;border-radius:12px;margin-top:6px}.task input{width:19px;height:19px}.task.done{text-decoration:line-through;opacity:.6}.empty{color:#b9c1e2;font-size:12px}
.nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0b1231f2;border-top:1px solid #3f477c;backdrop-filter:blur(15px)}.nav button{border:0;background:transparent;color:#aeb8de;font-size:10px;font-weight:700}.nav span{display:block;font-size:22px;margin-bottom:3px}.nav .active{color:#43a5ff}
.test{position:absolute;right:8px;top:8px;z-index:8;border:0;border-radius:12px;background:#ffffff22;padding:7px;font-size:10px}.phase-menu{position:absolute;right:8px;top:44px;z-index:8;display:none;gap:4px}.phase-menu.show{display:flex}.phase-menu button{border:0;border-radius:10px;background:#10183ddd;padding:7px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:30;background:#fff;color:#24213d;padding:10px 14px;border-radius:14px;font-weight:800;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:390px){.scene{min-height:370px}.pet-wrap{height:260px}.actions{gap:5px}.action{min-height:84px;font-size:11px}.quick button{font-size:10px}}
</style>
</head>
<body>
<main class="app">
<div class="layer">
<header class="header">
 <div class="profile"><div class="avatar">🐱</div><div class="title"><b>Minha Gatinha</b><small id="phaseName">Fase 1 • Filhote</small></div></div>
 <div class="stats"><div class="pill">⭐ <span id="xpTop">0</span></div><div class="pill">🪙 <span id="coins">15</span></div></div>
</header>

<section class="quick">
 <button onclick="scrollTasks()"><span>📋</span><b id="requiredCount">0/0</b><small>Obrigatórias</small></button>
 <button onclick="scrollTasks()"><span>⭐</span><b id="extraCount">0/0</b><small>Extras</small></button>
 <button><span>🔥</span><b id="streak">0</b><small>Ofensiva</small></button>
 <button onclick="toast('Loja será a próxima etapa')"><span>🎁</span><b>Loja</b><small>Em breve</small></button>
</section>

<section class="scene">
 <div class="moon">🌙</div><div class="bubble">Você consegue!<br>Eu acredito em você! 💜</div>
 <button class="test" onclick="togglePhases()">Testar fases</button>
 <div class="phase-menu" id="phaseMenu"><button onclick="setPhase(1)">1</button><button onclick="setPhase(2)">2</button><button onclick="setPhase(3)">3</button><button onclick="setPhase(4)">4</button></div>
 <div class="pet-wrap" id="petTap"><img id="petImg" class="pet-img" alt="Gatinha"><div class="pet-error" id="petError"></div></div>
 <div class="progress">⭐<div class="track"><div class="fill" id="xpFill"></div></div><span id="xpText">0/100</span><span id="phaseShort">Fase 1</span></div>
</section>

<section class="actions">
 <button class="action" onclick="petAction('carinho')"><span class="ico">💗</span>Carinho<small>Deixa ela feliz</small></button>
 <button class="action" onclick="petAction('danca')"><span class="ico">🏀</span>Brincar<small>Diversão e energia</small></button>
 <button class="action" onclick="feed()"><span class="ico">🥣</span>Alimentar<small>Saúde e crescimento</small></button>
 <button class="action" onclick="sleepPet()"><span class="ico">🌙</span>Dormir<small>Recupera energia</small></button>
</section>

<section class="tasks" id="tasks">
 <h3>✨ Missões de hoje</h3><div id="taskList"></div>
</section>
</div>
</main>

<nav class="nav">
 <button class="active"><span>🏠</span>Início</button>
 <button onclick="scrollTasks()"><span>🗓️</span>Tarefas</button>
 <button onclick="toast('Conquistas será implementado depois')"><span>🏆</span>Conquistas</button>
 <button onclick="toast('Loja será implementada depois')"><span>🛍️</span>Loja</button>
 <button onclick="toast('Mais opções serão adicionadas depois')"><span>•••</span>Mais</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const SAVE='ROTINAPET_LITE_V1';
const PET={
 evolucoes:[
  {fase:1,nome:'Filhote',nivel:1},
  {fase:2,nome:'Jovem',nivel:21},
  {fase:3,nome:'Estelar',nivel:41},
  {fase:4,nome:'Nobre',nivel:61}
 ]
};
const DEFAULT={
 moedas:15,streak:0,nivel:1,xp:0,faseTeste:1,
 tarefas:[
  {id:1,texto:'Escovar os dentes',tipo:'obrigatoria',feito:false,recompensa:5,xp:20},
  {id:2,texto:'Arrumar a cama',tipo:'obrigatoria',feito:false,recompensa:5,xp:20},
  {id:3,texto:'Guardar os brinquedos',tipo:'extra',feito:false,recompensa:3,xp:10}
 ]
};
let state=load();
function load(){try{return {...DEFAULT,...JSON.parse(localStorage.getItem(SAVE)||'{}')}}catch(_){return structuredClone(DEFAULT)}}
function save(){localStorage.setItem(SAVE,JSON.stringify(state))}
function phase(){return Math.max(1,Math.min(4,Number(state.faseTeste)||1))}
function pad(n){return String(n).padStart(2,'0')}

const SPRITES={
 idle:{count:8,ms:150},
 carinho:{count:10,ms:105},
 danca:{count:12,ms:85},
 celebracao:{count:12,ms:85}
};
let animToken=0, animTimer=0, current='idle';
const img=document.getElementById('petImg');
function spriteUrl(action,index){return `assets/sprites/gato/fase${phase()}/${action}/${action}_${pad(index)}.png`}
function showSpriteError(url){
 document.getElementById('petError').style.display='block';
 document.getElementById('petError').innerHTML=`Sprite não encontrado:<br><small>${url}</small>`;
 img.style.display='none';
}
function setFrame(action,index){
 const url=spriteUrl(action,index);
 img.onerror=()=>showSpriteError(url);
 img.onload=()=>{img.style.display='block';document.getElementById('petError').style.display='none'};
 img.src=url+'?v=clean1';
}
function play(action='idle',loop=true){
 clearTimeout(animTimer); animToken++; const my=animToken;
 current=SPRITES[action]?action:'idle'; let i=1;
 const step=()=>{
  if(my!==animToken)return;
  setFrame(current,i++);
  if(i>SPRITES[current].count){
   if(!loop){play('idle',true);return}
   i=1;
  }
  animTimer=setTimeout(step,SPRITES[current].ms);
 };
 step();
}
function petAction(action){play(action,false);toast(action==='carinho'?'💗 Carinho!':'🎾 Hora de brincar!')}
function feed(){state.xp=Math.min(100,state.xp+3);save();render();play('celebracao',false);toast('🥣 Nhac! +3 XP')}
function sleepPet(){play('idle',true);toast('🌙 Hora de descansar')}
function setPhase(n){state.faseTeste=n;save();render();play('idle',true);document.getElementById('phaseMenu').classList.remove('show')}
function togglePhases(){document.getElementById('phaseMenu').classList.toggle('show')}

function render(){
 const f=phase(), evo=PET.evolucoes[f-1];
 document.getElementById('phaseName').textContent=`Fase ${f} • ${evo.nome}`;
 document.getElementById('phaseShort').textContent=`Fase ${f}`;
 document.getElementById('coins').textContent=state.moedas;
 document.getElementById('streak').textContent=state.streak;
 document.getElementById('xpTop').textContent=state.xp;
 document.getElementById('xpText').textContent=`${state.xp}/100`;
 document.getElementById('xpFill').style.width=state.xp+'%';
 const req=state.tarefas.filter(t=>t.tipo==='obrigatoria'), ext=state.tarefas.filter(t=>t.tipo==='extra');
 document.getElementById('requiredCount').textContent=`${req.filter(t=>t.feito).length}/${req.length}`;
 document.getElementById('extraCount').textContent=`${ext.filter(t=>t.feito).length}/${ext.length}`;
 document.getElementById('taskList').innerHTML=state.tarefas.map(t=>`<label class="task ${t.feito?'done':''}"><input type="checkbox" ${t.feito?'checked':''} onchange="toggleTask(${t.id},this.checked)"><span>${t.tipo==='obrigatoria'?'📌':'⭐'} ${t.texto} · +${t.recompensa} 🪙</span></label>`).join('')||'<div class="empty">Nenhuma missão cadastrada.</div>';
}
function toggleTask(id,done){
 const t=state.tarefas.find(x=>x.id===id);if(!t)return;
 if(done&&!t.feito){state.moedas+=t.recompensa;state.xp=Math.min(100,state.xp+t.xp);play('celebracao',false)}
 t.feito=done;save();render();
}
function scrollTasks(){document.getElementById('tasks').scrollIntoView({behavior:'smooth'})}
let toastTimer;function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),1800)}
document.getElementById('petTap').addEventListener('click',()=>petAction('carinho'));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)play('idle',true)});
render();play('idle',true);
</script>
</body></html>
